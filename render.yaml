services:
  - type: web
    name: reddy-dev-search-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: EMBEDDING_BATCH_SIZE
        value: 16
